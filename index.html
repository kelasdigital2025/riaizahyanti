<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kuis Perubahan Energi – Kelas 8</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--tx:#17202e;--mu:#5d6b7e;--ac:#f59e0b;--ac2:#1d4ed8;--ok:#16a34a;--no:#dc2626;--bd:#d9e1ec;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1622;--card:#182233;--tx:#eaf0f8;--mu:#9aa8bd;--bd:#2a3750;--ac2:#60a5fa}}
:root[data-theme="dark"]{--bg:#0f1622;--card:#182233;--tx:#eaf0f8;--mu:#9aa8bd;--bd:#2a3750;--ac2:#60a5fa}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45}
#app{max-width:640px;margin:0 auto;padding:18px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:20px}
h1{margin:0 0 6px;font-size:1.6rem}h2{margin:0 0 12px;font-size:1.15rem}
p{color:var(--mu);margin:6px 0}
input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:1rem;margin:12px 0}
button{font:inherit;cursor:pointer}
.btn{background:var(--ac2);color:#fff;border:0;border-radius:10px;padding:12px 18px;font-weight:600;width:100%}
.top{display:flex;justify-content:space-between;font-size:.9rem;color:var(--mu);margin-bottom:8px}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;background:var(--ac);transition:width .3s}
.opt{display:block;width:100%;text-align:left;background:var(--bg);color:var(--tx);border:2px solid var(--bd);border-radius:12px;padding:12px 14px;margin:8px 0}
.opt:hover:not(:disabled){border-color:var(--ac2)}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--bg))}
.opt.no{border-color:var(--no);background:color-mix(in srgb,var(--no) 18%,var(--bg))}
.fb{margin:12px 0;padding:10px 12px;border-radius:10px;background:var(--bg);font-size:.95rem}
.score{font-size:4rem;font-weight:800;color:var(--ac);text-align:center;line-height:1.1}
.c{text-align:center}
.rv{border-top:1px solid var(--bd);padding:10px 0;font-size:.92rem}
.rv b{color:var(--no)}
</style>
</head>
<body>
<div id="app"></div>
<script>
// [pertanyaan, jawaban benar, salah1, salah2, salah3, penjelasan]
const Q=[
["Setrika listrik yang sedang dipakai mengubah energi ...","Listrik → kalor","Kalor → listrik","Kimia → bunyi","Cahaya → gerak","Elemen pemanas setrika mengubah energi listrik menjadi kalor."],
["Lampu pijar yang menyala mengubah energi listrik menjadi ...","Cahaya dan kalor","Bunyi dan gerak","Kimia dan bunyi","Gerak saja","Lampu pijar menghasilkan cahaya sekaligus banyak kalor."],
["Kipas angin yang berputar mengubah energi ...","Listrik → gerak","Gerak → listrik","Kalor → cahaya","Kimia → bunyi","Motor listrik mengubah energi listrik menjadi energi gerak."],
["Senter yang menyala karena baterai mengalami perubahan energi ...","Kimia → listrik → cahaya","Cahaya → listrik → kimia","Gerak → kalor → cahaya","Listrik → kimia → gerak","Baterai menyimpan energi kimia, diubah menjadi listrik, lalu cahaya."],
["Panel surya (sel surya) mengubah energi ...","Cahaya → listrik","Listrik → cahaya","Kalor → bunyi","Gerak → kimia","Sel surya menangkap cahaya matahari dan menghasilkan listrik."],
["Pada proses fotosintesis, tumbuhan mengubah energi ...","Cahaya → kimia","Kimia → cahaya","Kalor → gerak","Listrik → kimia","Energi cahaya matahari disimpan sebagai energi kimia (glukosa)."],
["Mikrofon mengubah energi ...","Bunyi → listrik","Listrik → bunyi","Cahaya → bunyi","Gerak → kalor","Getaran suara diubah menjadi sinyal listrik."],
["Pengeras suara (speaker) mengubah energi ...","Listrik → bunyi","Bunyi → listrik","Kalor → listrik","Cahaya → bunyi","Arus listrik menggetarkan membran sehingga timbul bunyi."],
["Bunyi Hukum Kekekalan Energi adalah ...","Energi tidak dapat diciptakan atau dimusnahkan, hanya berubah bentuk","Energi dapat diciptakan dari ketiadaan","Energi akan habis jika dipakai","Energi hanya ada dalam bentuk kalor","Total energi dalam sistem tertutup selalu tetap."],
["Buah kelapa jatuh dari pohon. Perubahan energinya ...","Potensial → kinetik","Kinetik → potensial","Kimia → kalor","Listrik → gerak","Ketinggian berkurang, kecepatan bertambah."],
["Dinamo sepeda yang menyalakan lampu mengubah energi ...","Gerak → listrik","Listrik → gerak","Kimia → listrik","Cahaya → gerak","Roda memutar dinamo sehingga dihasilkan listrik."],
["Urutan perubahan energi pada PLTA yang benar adalah ...","Potensial air → kinetik air → listrik","Listrik → kinetik → potensial","Kimia → kalor → listrik","Cahaya → kimia → listrik","Air jatuh memutar turbin yang menggerakkan generator."],
["Saat kedua telapak tangan digosok-gosokkan, terjadi perubahan energi ...","Gerak → kalor","Kalor → gerak","Listrik → gerak","Kimia → cahaya","Gesekan mengubah energi gerak menjadi kalor."],
["Kompor gas yang menyala mengubah energi ...","Kimia → kalor dan cahaya","Listrik → kalor","Kalor → kimia","Gerak → cahaya","Gas LPG menyimpan energi kimia yang dilepas sebagai panas dan cahaya."],
["Makanan yang kita makan menyimpan energi dalam bentuk ...","Energi kimia","Energi bunyi","Energi nuklir","Energi pegas","Makanan adalah sumber energi kimia bagi tubuh."],
["Lima benda bermassa sama berada pada ketinggian berbeda. Energi potensial terbesar dimiliki benda pada ketinggian ...","Paling tinggi","Paling rendah","Sama untuk semua","Tepat di tanah","Ep = m·g·h, makin tinggi h makin besar Ep."],
["Rumus energi potensial gravitasi adalah ...","Ep = m · g · h","Ep = ½ · m · v²","Ep = m · v","Ep = F · t","m = massa, g = gravitasi, h = ketinggian."],
["Rumus energi kinetik adalah ...","Ek = ½ · m · v²","Ek = m · g · h","Ek = m · v","Ek = F · s²","Ek bergantung pada massa dan kuadrat kecepatan."],
["Satuan energi dalam SI adalah ...","Joule","Watt","Newton","Pascal","Energi dan usaha dinyatakan dalam joule (J)."],
["Benda 2 kg berada pada ketinggian 5 m (g = 10 m/s²). Energi potensialnya adalah ...","100 J","10 J","50 J","20 J","Ep = 2 × 10 × 5 = 100 J."],
["Benda 4 kg bergerak dengan kecepatan 5 m/s. Energi kinetiknya adalah ...","50 J","100 J","20 J","25 J","Ek = ½ × 4 × 5² = 50 J."],
["Jika kecepatan sebuah mobil menjadi 2 kali semula, energi kinetiknya menjadi ...","4 kali semula","2 kali semula","Tetap","½ kali semula","Ek sebanding dengan v², jadi 2² = 4 kali."],
["Pada ayunan bandul, di titik tertinggi benda memiliki ...","Ep maksimum, Ek nol","Ek maksimum, Ep nol","Ep dan Ek sama-sama nol","Ek dan Ep sama-sama maksimum","Di titik tertinggi benda sesaat berhenti."],
["Pada ayunan bandul, di titik terendah benda memiliki ...","Ek maksimum, Ep minimum","Ep maksimum, Ek nol","Ek nol, Ep nol","Ep dan Ek sama besar","Di titik terendah kecepatan paling besar."],
["Televisi yang menyala mengubah energi listrik terutama menjadi ...","Cahaya, bunyi, dan kalor","Gerak dan kimia","Kimia dan kalor saja","Bunyi dan gerak","Layar menghasilkan cahaya, speaker bunyi, dan sebagian panas."],
["Berikut yang termasuk sumber energi terbarukan adalah ...","Angin","Batu bara","Minyak bumi","Gas alam","Angin tidak habis dan terus tersedia secara alami."],
["Berikut yang BUKAN sumber energi terbarukan adalah ...","Batu bara","Matahari","Air","Panas bumi","Batu bara berasal dari fosil dan membutuhkan jutaan tahun untuk terbentuk."],
["Pada PLTB (pembangkit listrik tenaga bayu/angin), terjadi perubahan energi ...","Kinetik angin → gerak turbin → listrik","Listrik → angin → kalor","Kimia → angin → listrik","Cahaya → angin → listrik","Angin memutar baling-baling yang menggerakkan generator."],
["Mesin sepeda motor berbahan bensin mengubah energi ...","Kimia → kalor → gerak","Listrik → kimia → gerak","Cahaya → kalor → kimia","Gerak → kimia → kalor","Pembakaran bensin menghasilkan panas yang menggerakkan piston."],
["Lampu pijar dianggap kurang efisien karena ...","Sebagian besar listrik berubah menjadi kalor, bukan cahaya","Tidak menghasilkan cahaya sama sekali","Menciptakan energi baru","Mengubah semua listrik menjadi cahaya","Energi yang berubah menjadi kalor terbuang percuma."]
];
const $=document.getElementById("app");
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let S;
function start(){
  $.innerHTML=`<div class="card"><h1>⚡ Kuis Perubahan Energi</h1><p>IPA Kelas 8 • 30 soal pilihan ganda • Nilai akhir 0–100</p>
  <input id="nm" placeholder="Tulis namamu" maxlength="40" autocomplete="name"><button class="btn" id="go">Mulai</button></div>`;
  document.getElementById("go").onclick=()=>{
    S={name:(document.getElementById("nm").value||"").trim()||"Siswa",order:sh(Q.map((_,i)=>i)),i:0,ok:0,streak:0,best:0,wrong:[]};
    show();
  };
}
function show(){
  const q=Q[S.order[S.i]];
  const opts=sh([[q[1],1],[q[2],0],[q[3],0],[q[4],0]]);
  $.innerHTML=`<div class="card"><div class="top"><span>Soal ${S.i+1}/${Q.length}</span><span>✅ ${S.ok} &nbsp; 🔥 ${S.streak}</span></div>
  <div class="bar"><i style="width:${S.i/Q.length*100}%"></i></div><h2>${q[0]}</h2><div id="o"></div><div id="f"></div></div>`;
  const o=document.getElementById("o");
  opts.forEach(([t,c])=>{
    const b=document.createElement("button");b.className="opt";b.textContent=t;
    b.onclick=()=>answer(q,opts,b,c,t);o.appendChild(b);
  });
}
function answer(q,opts,btn,c,t){
  const bs=[...document.querySelectorAll(".opt")];
  bs.forEach((b,k)=>{b.disabled=true;if(opts[k][1])b.classList.add("ok")});
  if(c){S.ok++;S.streak++;S.best=Math.max(S.best,S.streak)}
  else{btn.classList.add("no");S.streak=0;S.wrong.push({q:q[0],a:q[1],e:q[5]})}
  const last=S.i===Q.length-1;
  document.getElementById("f").innerHTML=`<div class="fb">${c?"🎉 Benar!":"❌ Belum tepat."} ${q[5]}</div><button class="btn" id="nx">${last?"Lihat nilai":"Soal berikutnya"}</button>`;
  document.getElementById("nx").onclick=()=>{if(last)finish();else{S.i++;show()}};
}
function finish(){
  const n=Math.round(S.ok/Q.length*100);
  const p=n>=85?"Sangat Baik 🏆":n>=70?"Baik 👍":n>=55?"Cukup 🙂":"Perlu belajar lagi 📚";
  const tgl=new Date().toLocaleDateString("id-ID",{day:"numeric",month:"long",year:"numeric"});
  $.innerHTML=`<div class="card c"><h2>Hasil: ${S.name.replace(/[<>&]/g,"")}</h2><div class="score">${n}</div><p><b>${p}</b></p>
  <p>Benar ${S.ok} dari ${Q.length} • Beruntun terbaik 🔥 ${S.best}</p><p>${tgl}</p>
  <p style="font-size:.85rem">Tangkap layar halaman ini sebagai bukti nilai.</p><button class="btn" id="re">Main lagi</button></div>
  ${S.wrong.length?`<div class="card" style="margin-top:14px"><h2>Pembahasan soal yang salah</h2>${S.wrong.map(w=>`<div class="rv">${w.q}<br><b>Jawaban:</b> ${w.a}<br><span style="color:var(--mu)">${w.e}</span></div>`).join("")}</div>`:""}`;
  document.getElementById("re").onclick=start;
}
start();
</script>
</body>
</html>
